name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The sandbox fake shells out to real git, so identity must exist for the
      # snapshot commit it makes. Windows runners in particular have none.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@principal.invalid"
          git config --global user.name "Principal CI"

      - name: Doctor
        run: python -m principal.cli doctor

      - name: Tests
        run: python -m pytest -q

  lint:
    name: lint and architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check principal mcp_code_graph bench tests spikes

      # The central architectural claim of this project — "no model in the accept
      # path" — expressed as something a machine checks. If this job fails, the
      # guarantee in the README has stopped being true.
      # `python -m importlinter.cli lint` exits 0 without evaluating a single
      # contract, so it would pass this job while the guarantee was broken.
      # `lint-imports` is the invocation that actually reports.
      - name: Architecture contracts
        run: lint-imports

  compliance:
    name: submission compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hackathon requires a license file detectable at the top of the
      # repository page. GitHub's detector needs the file named exactly LICENSE
      # with unmodified text, so a well-meant edit silently breaks the
      # requirement. Checking it here means we find out, rather than a judge.
      - name: License file present and detectable
        run: |
          test -f LICENSE || { echo "::error::LICENSE is missing"; exit 1; }
          grep -q "Apache License" LICENSE || { echo "::error::LICENSE is not Apache 2.0"; exit 1; }
          grep -q "Version 2.0, January 2004" LICENSE || { echo "::error::Apache header altered; GitHub will not detect it"; exit 1; }
          echo "LICENSE: Apache-2.0, detectable"

      - name: Required documents present
        run: |
          for f in README.md NOTICE docs/FEEDBACK.md docs/SUBMISSION.md docs/DEMO_VIDEO.md; do
            test -f "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          echo "all required submission documents present"

      - name: README covers the mandated topics
        run: |
          fail=0
          check() {
            grep -qi -- "$1" README.md || { echo "::error::README does not mention: $2"; fail=1; }
          }
          check "Nemotron"                    "NVIDIA Nemotron"
          check "Token Factory"               "Nebius Token Factory"
          check "Coding and Agentic Engineering" "the submitted track"
          check "Apache"                      "the license"
          exit $fail

      # A public repository must not carry personal documents. This is cheap
      # insurance against a stray file in someone's working directory.
      - name: No personal documents committed
        run: |
          if git ls-files | grep -iE '\.(pdf|docx)$'; then
            echo "::error::a document is tracked in a repository that must be public"
            exit 1
          fi
          echo "no personal documents tracked"

  docker:
    name: hosted demo image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: principal:ci

      # The demo URL requirement means this image has to serve with no
      # credentials at all. Asserting it here is the difference between
      # believing that and knowing it.
      - name: Serves with no credentials
        run: |
          docker run -d --name principal-ci -p 8000:8000 principal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q 'FakeSandbox' /tmp/health.json
          docker rm -f principal-ci
