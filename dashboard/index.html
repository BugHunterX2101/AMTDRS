<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Principal — refactors that arrive already verified</title>
    <meta
      name="description"
      content="An autonomous technical debt remediation swarm. Principal races parallel refactor candidates inside Token Factory Sandboxes and opens a pull request only when the repository's own test suite passes. No green test, no PR."
    />
    <link rel="canonical" href="https://amtdrs.onrender.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Principal — refactors that arrive already verified" />
    <meta
      property="og:description"
      content="No model sits in the accept path. The decision to keep a patch is a pytest exit code from a real run in a sandbox. Fail closed: no green test, no PR."
    />
    <meta property="og:url" content="https://amtdrs.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />

    <!-- The headline face, fetched in parallel with the CSS rather than after it. -->
    <link
      rel="preload"
      href="./src/landing/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open the console the instant it is hovered or focused. Prerender is
         ignored by browsers that do not support it, so this costs nothing
         elsewhere. The console only reads /healthz on load. -->
    <script type="speculationrules">
      { "prerender": [{ "urls": ["./app/"], "eagerness": "moderate" }] }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.jsx"></script>
  </body>
</html>
