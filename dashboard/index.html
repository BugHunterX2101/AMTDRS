<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Principal — refactors that arrive already verified</title>
    <meta
      name="description"
      content="An autonomous technical debt remediation swarm. Principal races parallel refactor candidates inside Token Factory Sandboxes and opens a pull request only when the repository's own test suite passes. No green test, no PR."
    />
    <link rel="canonical" href="https://amtdrs.onrender.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Principal — refactors that arrive already verified" />
    <meta
      property="og:description"
      content="No model sits in the accept path. The decision to keep a patch is a pytest exit code from a real run in a sandbox. Fail closed: no green test, no PR."
    />
    <meta property="og:url" content="https://amtdrs.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0c0b09" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0b09'/%3E%3Cpath d='M9 11l5 5-5 5' fill='none' stroke='%235ce08f' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h7' stroke='%23ede8dd' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="color-scheme" content="dark" />

    <!-- The headline and body faces, fetched in parallel with the CSS rather than
         after it. The italic and the mono are below the fold or small, so they
         are left to load on demand. -->
    <link rel="preload" href="./src/landing/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/landing/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open the console the instant it is hovered or focused. Prerender is
         ignored by browsers that do not support it, so this costs nothing
         elsewhere. The console only reads /healthz on load. -->
    <script type="speculationrules">
      { "prerender": [{ "urls": ["./app/"], "eagerness": "moderate" }] }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.jsx"></script>
  </body>
</html>
