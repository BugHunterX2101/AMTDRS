[project]
name = "weak-repo"
version = "0.1.0"
description = "Fixture repository: a pricing module whose visible tests miss two callers and a string lookup."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
